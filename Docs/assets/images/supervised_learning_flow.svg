<svg viewBox="0 0 680 320" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; border:1px solid #e0e0e0; border-radius:8px; padding:16px; font-family: Arial, sans-serif;">
  <!-- Title -->
  <text x="340" y="30" fill="#0070f3" font-size="20" font-weight="bold" text-anchor="middle">Supervised Learning Model Process</text>

  <!-- Step 1: Training Phase Box -->
  <rect x="30" y="55" width="620" height="105" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="45" y="75" fill="#475569" font-size="12" font-weight="bold">STAGE 1: TRAINING THE MODEL</text>

  <!-- Training Set -->
  <rect x="50" y="90" width="150" height="50" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="125" y="112" fill="#0369a1" font-size="13" font-weight="bold" text-anchor="middle">Training Set</text>
  <text x="125" y="128" fill="#0284c7" font-size="11" text-anchor="middle">Features (x) + Targets (y)</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="115" x2="260" y2="115" stroke="#0070f3" stroke-width="2.5"/>
  <polygon points="260,115 250,110 250,120" fill="#0070f3"/>

  <!-- Learning Algorithm -->
  <rect x="260" y="90" width="160" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="340" y="112" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">Learning Algorithm</text>
  <text x="340" y="128" fill="#b45309" font-size="11" text-anchor="middle">Learns parameters (w, b)</text>

  <!-- Arrow 2 -->
  <line x1="420" y1="115" x2="480" y2="115" stroke="#0070f3" stroke-width="2.5"/>
  <polygon points="480,115 470,110 470,120" fill="#0070f3"/>

  <!-- Model Function f -->
  <rect x="480" y="90" width="150" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="555" y="112" fill="#15803d" font-size="13" font-weight="bold" text-anchor="middle">Model Function f</text>
  <text x="555" y="128" fill="#16a34a" font-size="11" text-anchor="middle">f(x) = wx + b</text>

  <!-- Step 2: Prediction / Inference Phase Box -->
  <rect x="30" y="180" width="620" height="115" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="45" y="200" fill="#475569" font-size="12" font-weight="bold">STAGE 2: PREDICTION / INFERENCE</text>

  <!-- New Input x -->
  <rect x="50" y="220" width="150" height="50" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="125" y="242" fill="#6b21a8" font-size="13" font-weight="bold" text-anchor="middle">New Feature (x)</text>
  <text x="125" y="258" fill="#7e22ce" font-size="11" text-anchor="middle">e.g. Size = 1250 sq ft</text>

  <!-- Arrow 3 -->
  <line x1="200" y1="245" x2="260" y2="245" stroke="#9333ea" stroke-width="2.5"/>
  <polygon points="260,245 250,240 250,250" fill="#9333ea"/>

  <!-- Model Function f (Inference) -->
  <rect x="260" y="220" width="160" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="340" y="242" fill="#15803d" font-size="13" font-weight="bold" text-anchor="middle">Model f(x)</text>
  <text x="340" y="258" fill="#16a34a" font-size="11" text-anchor="middle">Computes f(x) = wx + b</text>

  <!-- Arrow 4 -->
  <line x1="420" y1="245" x2="480" y2="245" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="480,245 470,240 470,250" fill="#16a34a"/>

  <!-- Prediction y-hat -->
  <rect x="480" y="220" width="150" height="50" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text x="555" y="242" fill="#be123c" font-size="13" font-weight="bold" text-anchor="middle">Prediction (ŷ)</text>
  <text x="555" y="258" fill="#e11d48" font-size="11" text-anchor="middle">e.g. Estimated Price = $220k</text>
</svg>