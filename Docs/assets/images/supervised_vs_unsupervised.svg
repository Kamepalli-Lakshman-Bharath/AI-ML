<svg viewBox="0 0 700 320" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; border:1px solid #e0e0e0; border-radius:8px; padding:16px; font-family: Arial, sans-serif;">
  <style>
    .title { font-size: 16px; font-weight: bold; }
    .label { font-size: 13px; font-weight: bold; fill: #333333; }
    .axis { stroke: #000000; stroke-width: 2.5; }
    .grid { stroke: #e5e7eb; stroke-dasharray: 4; }
  </style>

  <!-- Supervised Plot (Left) -->
  <g transform="translate(20, 10)">
    <text x="140" y="30" class="title" fill="#0070f3" text-anchor="middle">Supervised Learning (Labeled Y)</text>
    <line x1="40" y1="250" x2="260" y2="250" class="axis"/>
    <line x1="40" y1="250" x2="40" y2="60" class="axis"/>

    <text x="150" y="285" class="label" text-anchor="middle">Tumor Size (X1)</text>
    <text x="20" y="155" class="label" transform="rotate(-90 20,155)" text-anchor="middle">Age (X2)</text>

    <!-- Benign (O) -->
    <circle cx="80" cy="210" r="7" fill="none" stroke="#0070f3" stroke-width="2.5"/>
    <circle cx="110" cy="180" r="7" fill="none" stroke="#0070f3" stroke-width="2.5"/>
    <circle cx="90" cy="140" r="7" fill="none" stroke="#0070f3" stroke-width="2.5"/>
    <circle cx="140" cy="190" r="7" fill="none" stroke="#0070f3" stroke-width="2.5"/>

    <!-- Malignant (X) -->
    <path d="M 180 110 L 194 124 M 194 110 L 180 124" stroke="#ff0000" stroke-width="3"/>
    <path d="M 210 140 L 224 154 M 224 140 L 210 154" stroke="#ff0000" stroke-width="3"/>
    <path d="M 195 75 L 209 89 M 209 75 L 195 89" stroke="#ff0000" stroke-width="3"/>
    <path d="M 230 100 L 244 114 M 244 100 L 230 114" stroke="#ff0000" stroke-width="3"/>

    <!-- Decision Boundary -->
    <line x1="160" y1="60" x2="175" y2="250" stroke="#70a800" stroke-width="3" stroke-dasharray="6,4"/>

    <text x="95" y="90" fill="#0070f3" font-size="12" font-weight="bold">Benign (O)</text>
    <text x="180" y="55" fill="#ff0000" font-size="12" font-weight="bold">Malignant (X)</text>
  </g>

  <!-- Divider -->
  <line x1="345" y1="20" x2="345" y2="300" stroke="#d1d5db" stroke-width="2" stroke-dasharray="4"/>

  <!-- Unsupervised Plot (Right) -->
  <g transform="translate(360, 10)">
    <text x="140" y="30" class="title" fill="#70a800" text-anchor="middle">Unsupervised Learning (No Labels)</text>
    <line x1="40" y1="250" x2="260" y2="250" class="axis"/>
    <line x1="40" y1="250" x2="40" y2="60" class="axis"/>

    <text x="150" y="285" class="label" text-anchor="middle">Feature X1</text>
    <text x="20" y="155" class="label" transform="rotate(-90 20,155)" text-anchor="middle">Feature X2</text>

    <!-- Cluster 1 (Unlabeled dots) -->
    <ellipse cx="105" cy="180" rx="45" ry="35" fill="#e0f2fe" stroke="#0284c7" stroke-dasharray="4,3" stroke-width="2"/>
    <circle cx="80" cy="210" r="6" fill="#1e293b"/>
    <circle cx="110" cy="180" r="6" fill="#1e293b"/>
    <circle cx="90" cy="155" r="6" fill="#1e293b"/>
    <circle cx="130" cy="190" r="6" fill="#1e293b"/>
    <text x="105" y="130" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle">Cluster 1</text>

    <!-- Cluster 2 (Unlabeled dots) -->
    <ellipse cx="210" cy="105" rx="45" ry="35" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="4,3" stroke-width="2"/>
    <circle cx="185" cy="115" r="6" fill="#1e293b"/>
    <circle cx="215" cy="135" r="6" fill="#1e293b"/>
    <circle cx="200" cy="80" r="6" fill="#1e293b"/>
    <circle cx="235" cy="95" r="6" fill="#1e293b"/>
    <text x="210" y="58" fill="#16a34a" font-size="12" font-weight="bold" text-anchor="middle">Cluster 2</text>
  </g>
</svg>