<svg viewBox="0 0 650 360" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; border:1px solid #e0e0e0; border-radius:8px; padding:16px; font-family: Arial, sans-serif;">
  <!-- Title -->
  <text x="30" y="40" fill="#0070f3" font-size="22" font-weight="bold">Linear Regression:<tspan fill="#222222" font-weight="normal"> Portland Housing Dataset</tspan></text>

  <!-- Y axis -->
  <line x1="100" y1="270" x2="100" y2="80" stroke="#000000" stroke-width="3"/>
  <line x1="90" y1="270" x2="100" y2="270" stroke="#000000" stroke-width="3"/>
  <line x1="90" y1="222.5" x2="100" y2="222.5" stroke="#000000" stroke-width="3"/>
  <line x1="90" y1="175" x2="100" y2="175" stroke="#000000" stroke-width="3"/>
  <line x1="90" y1="127.5" x2="100" y2="127.5" stroke="#000000" stroke-width="3"/>
  <line x1="90" y1="80" x2="100" y2="80" stroke="#000000" stroke-width="3"/>

  <text x="80" y="275" fill="#000000" font-size="13" text-anchor="end">0</text>
  <text x="80" y="227" fill="#000000" font-size="13" text-anchor="end">100</text>
  <text x="80" y="180" fill="#000000" font-size="13" text-anchor="end">200</text>
  <text x="80" y="132" fill="#000000" font-size="13" text-anchor="end">300</text>
  <text x="80" y="85" fill="#000000" font-size="13" text-anchor="end">400</text>

  <text x="40" y="175" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">Price (y)</text>
  <text x="40" y="195" fill="#000000" font-size="13" text-anchor="middle">in $1000's</text>

  <!-- X axis -->
  <line x1="100" y1="270" x2="560" y2="270" stroke="#000000" stroke-width="3"/>
  <line x1="100" y1="270" x2="100" y2="280" stroke="#000000" stroke-width="3"/>
  <line x1="192" y1="270" x2="192" y2="280" stroke="#000000" stroke-width="3"/>
  <line x1="284" y1="270" x2="284" y2="280" stroke="#000000" stroke-width="3"/>
  <line x1="376" y1="270" x2="376" y2="280" stroke="#000000" stroke-width="3"/>
  <line x1="468" y1="270" x2="468" y2="280" stroke="#000000" stroke-width="3"/>
  <line x1="560" y1="270" x2="560" y2="280" stroke="#000000" stroke-width="3"/>

  <text x="100" y="300" fill="#000000" font-size="13" text-anchor="middle">0</text>
  <text x="192" y="300" fill="#000000" font-size="13" text-anchor="middle">500</text>
  <text x="284" y="300" fill="#000000" font-size="13" text-anchor="middle">1000</text>
  <text x="376" y="300" fill="#000000" font-size="13" text-anchor="middle">1500</text>
  <text x="468" y="300" fill="#000000" font-size="13" text-anchor="middle">2000</text>
  <text x="560" y="300" fill="#000000" font-size="13" text-anchor="middle">2500</text>

  <text x="330" y="325" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">Size in sq ft (x)</text>

  <!-- Data Crosses (X) -->
  <path d="M 180 230 L 190 240 M 190 230 L 180 240" stroke="#ff0000" stroke-width="3"/>
  <path d="M 210 205 L 220 215 M 220 205 L 210 215" stroke="#ff0000" stroke-width="3"/>
  <path d="M 270 170 L 280 180 M 280 170 L 270 180" stroke="#ff0000" stroke-width="3"/>
  <path d="M 320 145 L 330 155 M 330 145 L 320 155" stroke="#ff0000" stroke-width="3"/>
  <path d="M 390 120 L 400 130 M 400 120 L 390 130" stroke="#ff0000" stroke-width="3"/>
  
  <!-- Highlighted 1st Example (x^(1)=2104, y^(1)=400) -->
  <path d="M 482 75 L 494 87 M 494 75 L 482 87" stroke="#0070f3" stroke-width="3.5"/>
  <circle cx="488" cy="81" r="10" fill="none" stroke="#0070f3" stroke-width="2.5" stroke-dasharray="4,3"/>
  <text x="502" y="75" fill="#0070f3" font-size="12" font-weight="bold">(x⁽¹⁾ = 2104, y⁽¹⁾ = 400)</text>

  <!-- Fitted Linear Line -->
  <line x1="110" y1="235" x2="520" y2="80" stroke="#1890ff" stroke-width="3.5"/>

  <!-- Prediction Example at x = 1250 sq ft -->
  <line x1="330" y1="270" x2="330" y2="152" stroke="#ff9c6e" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="330" y1="152" x2="100" y2="152" stroke="#eb2f96" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="330" cy="152" r="5" fill="#eb2f96"/>
  <text x="330" y="315" fill="#d97706" font-size="12" font-weight="bold" text-anchor="middle">x = 1250</text>
  <text x="90" y="156" fill="#eb2f96" font-size="12" font-weight="bold" text-anchor="end">ŷ ≈ $220k</text>
</svg>