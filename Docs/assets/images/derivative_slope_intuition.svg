<svg viewBox="0 0 680 320" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; border:1px solid #e0e0e0; border-radius:8px; padding:16px; font-family: Arial, sans-serif;">
  <text x="340" y="30" fill="#0070f3" font-size="18" font-weight="bold" text-anchor="middle">Derivative Slope Intuition: Why Gradient Descent Always Decreases Cost</text>

  <!-- Left: Positive Slope (w starts to the right of minimum) -->
  <g transform="translate(20, 20)">
    <rect x="10" y="35" width="290" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="155" y="60" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">CASE 1: Positive Slope (Derivative &gt; 0)</text>

    <!-- Axes -->
    <line x1="40" y1="220" x2="270" y2="220" stroke="#000" stroke-width="2"/>
    <line x1="40" y1="220" x2="40" y2="70" stroke="#000" stroke-width="2"/>

    <!-- U-shaped Curve -->
    <path d="M 50 80 Q 155 240 260 80" fill="none" stroke="#64748b" stroke-width="2"/>

    <!-- Point on right side -->
    <circle cx="220" cy="115" r="5" fill="#e11d48"/>
    
    <!-- Tangent Line (Positive Slope, Slants UP right) -->
    <line x1="170" y1="165" x2="250" y2="85" stroke="#e11d48" stroke-width="2"/>
    <text x="220" y="75" font-size="11" font-weight="bold" fill="#e11d48">Slope &gt; 0</text>

    <!-- Movement Arrow pointing LEFT -->
    <line x1="210" y1="230" x2="160" y2="230" stroke="#0070f3" stroke-width="3"/>
    <polygon points="160,230 170,225 170,235" fill="#0070f3"/>
    <text x="185" y="250" font-size="11" font-weight="bold" fill="#0070f3" text-anchor="middle">w = w - α(+val) → Moves Left</text>
  </g>

  <!-- Right: Negative Slope (w starts to the left of minimum) -->
  <g transform="translate(350, 20)">
    <rect x="10" y="35" width="290" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="155" y="60" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">CASE 2: Negative Slope (Derivative &lt; 0)</text>

    <!-- Axes -->
    <line x1="40" y1="220" x2="270" y2="220" stroke="#000" stroke-width="2"/>
    <line x1="40" y1="220" x2="40" y2="70" stroke="#000" stroke-width="2"/>

    <!-- U-shaped Curve -->
    <path d="M 50 80 Q 155 240 260 80" fill="none" stroke="#64748b" stroke-width="2"/>

    <!-- Point on left side -->
    <circle cx="90" cy="115" r="5" fill="#16a34a"/>
    
    <!-- Tangent Line (Negative Slope, Slants DOWN right) -->
    <line x1="60" y1="85" x2="140" y2="165" stroke="#16a34a" stroke-width="2"/>
    <text x="50" y="75" font-size="11" font-weight="bold" fill="#16a34a">Slope &lt; 0</text>

    <!-- Movement Arrow pointing RIGHT -->
    <line x1="100" y1="230" x2="150" y2="230" stroke="#16a34a" stroke-width="3"/>
    <polygon points="150,230 140,225 140,235" fill="#16a34a"/>
    <text x="125" y="250" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">w = w - α(-val) → Moves Right</text>
  </g>
</svg>