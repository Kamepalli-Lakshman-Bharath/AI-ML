<svg viewBox="0 0 720 340" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; border:1px solid #e0e0e0; border-radius:8px; padding:16px; font-family: Arial, sans-serif;">
  <!-- Title -->
  <text x="360" y="30" fill="#0070f3" font-size="20" font-weight="bold" text-anchor="middle">Cost Function Intuition: Model f(x) vs. Cost J(w)</text>

  <!-- Left Side: Model Plot f_w(x) -->
  <g transform="translate(20, 20)">
    <text x="140" y="35" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Model: f_w(x) = w · x</text>
    
    <!-- Axes -->
    <line x1="40" y1="240" x2="260" y2="240" stroke="#000" stroke-width="2.5"/>
    <line x1="40" y1="240" x2="40" y2="50" stroke="#000" stroke-width="2.5"/>

    <text x="150" y="275" font-size="13" font-weight="bold" text-anchor="middle">Feature (x)</text>
    <text x="20" y="145" font-size="13" font-weight="bold" transform="rotate(-90 20,145)" text-anchor="middle">Target (y)</text>

    <!-- Ticks -->
    <text x="40" y="255" font-size="11" text-anchor="middle">0</text>
    <text x="100" y="255" font-size="11" text-anchor="middle">1</text>
    <text x="160" y="255" font-size="11" text-anchor="middle">2</text>
    <text x="220" y="255" font-size="11" text-anchor="middle">3</text>

    <text x="30" y="244" font-size="11" text-anchor="end">0</text>
    <text x="30" y="184" font-size="11" text-anchor="end">1</text>
    <text x="30" y="124" font-size="11" text-anchor="end">2</text>
    <text x="30" y="64" font-size="11" text-anchor="end">3</text>

    <!-- Training Data Points (1,1), (2,2), (3,3) -->
    <path d="M 94 178 L 106 190 M 106 178 L 94 190" stroke="#ff0000" stroke-width="3"/>
    <path d="M 154 118 L 166 130 M 166 118 L 154 130" stroke="#ff0000" stroke-width="3"/>
    <path d="M 214 58 L 226 70 M 226 58 L 214 70" stroke="#ff0000" stroke-width="3"/>

    <!-- Line for w = 1 (Blue) -->
    <line x1="40" y1="240" x2="240" y2="40" stroke="#0070f3" stroke-width="3"/>
    <text x="225" y="35" font-size="11" font-weight="bold" fill="#0070f3">w = 1</text>

    <!-- Line for w = 0.5 (Green) -->
    <line x1="40" y1="240" x2="240" y2="140" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="245" y="135" font-size="11" font-weight="bold" fill="#16a34a">w = 0.5</text>

    <!-- Error dashed bars for w = 0.5 -->
    <line x1="100" y1="184" x2="100" y2="210" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="160" y1="124" x2="160" y2="176" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="220" y1="64" x2="220" y2="142" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>

  <!-- Divider -->
  <line x1="345" y1="40" x2="345" y2="300" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4"/>

  <!-- Right Side: Cost Function Plot J(w) -->
  <g transform="translate(360, 20)">
    <text x="160" y="35" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Cost Function: J(w)</text>
    
    <!-- Axes -->
    <line x1="50" y1="240" x2="290" y2="240" stroke="#000" stroke-width="2.5"/>
    <line x1="150" y1="240" x2="150" y2="50" stroke="#000" stroke-width="2.5"/>

    <text x="170" y="275" font-size="13" font-weight="bold" text-anchor="middle">Parameter (w)</text>
    <text x="30" y="145" font-size="13" font-weight="bold" transform="rotate(-90 30,145)" text-anchor="middle">Cost J(w)</text>

    <!-- Ticks -->
    <text x="50" y="255" font-size="11" text-anchor="middle">-0.5</text>
    <text x="100" y="255" font-size="11" text-anchor="middle">0</text>
    <text x="150" y="255" font-size="11" text-anchor="middle">0.5</text>
    <text x="200" y="255" font-size="11" font-weight="bold" fill="#0070f3" text-anchor="middle">1.0</text>
    <text x="250" y="255" font-size="11" text-anchor="middle">1.5</text>
    <text x="285" y="255" font-size="11" text-anchor="middle">2.0</text>

    <!-- U-shaped Parabola Path for J(w) -->
    <path d="M 50 60 Q 200 240 290 90" fill="none" stroke="#7c3aed" stroke-width="3"/>

    <!-- Point at w = 1, J(1) = 0 (Minimum) -->
    <circle cx="200" cy="240" r="6" fill="#0070f3"/>
    <text x="200" y="225" font-size="11" font-weight="bold" fill="#0070f3" text-anchor="middle">Min J(1) = 0</text>

    <!-- Point at w = 0.5, J(0.5) = 0.58 -->
    <circle cx="150" cy="195" r="5" fill="#16a34a"/>
    <text x="110" y="195" font-size="11" font-weight="bold" fill="#16a34a">J(0.5)=0.58</text>

    <!-- Point at w = 0, J(0) = 2.33 -->
    <circle cx="100" cy="120" r="5" fill="#e11d48"/>
    <text x="60" y="115" font-size="11" font-weight="bold" fill="#e11d48">J(0)=2.33</text>
  </g>
</svg>