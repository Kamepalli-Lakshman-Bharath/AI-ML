<svg viewBox="0 0 600 320" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; border:1px solid #e0e0e0; border-radius:8px; padding:16px; font-family: Arial, sans-serif;">
  <text x="30" y="35" fill="#0070f3" font-size="20" font-weight="bold">Classification:<tspan fill="#222222" font-weight="normal"> Breast Cancer Detection</tspan></text>

  <!-- Axes -->
  <line x1="70" y1="260" x2="540" y2="260" stroke="#000000" stroke-width="2.5"/>
  <line x1="70" y1="260" x2="70"  y2="50"  stroke="#000000" stroke-width="2.5"/>

  <!-- Labels -->
  <text x="305" y="295" fill="#000000" font-size="14" text-anchor="middle" font-weight="bold">Tumor Size (X1)</text>
  <text x="25" y="155" fill="#000000" font-size="14" transform="rotate(-90 25,155)" text-anchor="middle" font-weight="bold">Patient Age (X2)</text>

  <!-- Benign Data Points (Circles - O) -->
  <circle cx="120" cy="220" r="8" fill="none" stroke="#0070f3" stroke-width="2.5"/>
  <circle cx="160" cy="190" r="8" fill="none" stroke="#0070f3" stroke-width="2.5"/>
  <circle cx="140" cy="140" r="8" fill="none" stroke="#0070f3" stroke-width="2.5"/>
  <circle cx="210" cy="210" r="8" fill="none" stroke="#0070f3" stroke-width="2.5"/>
  <circle cx="200" cy="160" r="8" fill="none" stroke="#0070f3" stroke-width="2.5"/>
  <circle cx="240" cy="100" r="8" fill="none" stroke="#0070f3" stroke-width="2.5"/>

  <!-- Malignant Data Points (Crosses - X) -->
  <path d="M 330 85 L 344 99 M 344 85 L 330 99" stroke="#ff0000" stroke-width="3"/>
  <path d="M 380 130 L 394 144 M 394 130 L 380 144" stroke="#ff0000" stroke-width="3"/>
  <path d="M 350 170 L 364 184 M 364 170 L 350 184" stroke="#ff0000" stroke-width="3"/>
  <path d="M 420 100 L 434 114 M 434 100 L 420 114" stroke="#ff0000" stroke-width="3"/>
  <path d="M 440 180 L 454 194 M 454 180 L 440 194" stroke="#ff0000" stroke-width="3"/>
  <path d="M 480 140 L 494 154 M 494 140 L 480 154" stroke="#ff0000" stroke-width="3"/>

  <!-- Decision Boundary Line -->
  <line x1="280" y1="50" x2="300" y2="260" stroke="#70a800" stroke-width="3.5" stroke-dasharray="6,4"/>

  <!-- Region Labels -->
  <text x="160" y="70" fill="#0070f3" font-size="13" font-weight="bold">Benign Region (O)</text>
  <text x="380" y="70" fill="#ff0000" font-size="13" font-weight="bold">Malignant Region (X)</text>
  <text x="315" y="230" fill="#70a800" font-size="12" font-weight="bold">Decision Boundary</text>
</svg>