<svg viewBox="0 0 680 300" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; border:1px solid #e0e0e0; border-radius:8px; padding:16px; font-family: Arial, sans-serif;">
  <text x="340" y="30" fill="#0070f3" font-size="18" font-weight="bold" text-anchor="middle">Effects of Learning Rate (α) on Gradient Descent</text>

  <!-- Panel 1: Too Small Alpha -->
  <g transform="translate(10, 20)">
    <rect x="10" y="35" width="200" height="225" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="110" y="58" font-size="13" font-weight="bold" fill="#0284c7" text-anchor="middle">α Too Small</text>
    <path d="M 25 80 Q 110 240 195 80" fill="none" stroke="#64748b" stroke-width="2"/>
    
    <!-- Tiny steps -->
    <circle cx="35" cy="100" r="3" fill="#e11d48"/>
    <line x1="35" y1="100" x2="42" y2="112" stroke="#e11d48" stroke-width="1.5"/>
    <circle cx="42" cy="112" r="3" fill="#e11d48"/>
    <line x1="42" y1="112" x2="50" y2="125" stroke="#e11d48" stroke-width="1.5"/>
    <circle cx="50" cy="125" r="3" fill="#e11d48"/>
    <line x1="50" y1="125" x2="58" y2="138" stroke="#e11d48" stroke-width="1.5"/>
    
    <text x="110" y="225" font-size="11" font-weight="bold" fill="#0284c7" text-anchor="middle">Extremely Slow</text>
    <text x="110" y="240" font-size="10" fill="#475569" text-anchor="middle">Requires 1000s of tiny steps</text>
  </g>

  <!-- Panel 2: Optimal Alpha -->
  <g transform="translate(230, 20)">
    <rect x="10" y="35" width="200" height="225" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="110" y="58" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">✓ Optimal α</text>
    <path d="M 25 80 Q 110 240 195 80" fill="none" stroke="#64748b" stroke-width="2"/>

    <!-- Efficient shrinking steps -->
    <circle cx="35" cy="100" r="4" fill="#16a34a"/>
    <line x1="35" y1="100" x2="70" y2="160" stroke="#16a34a" stroke-width="2"/>
    <circle cx="70" cy="160" r="4" fill="#16a34a"/>
    <line x1="70" y1="160" x2="95" y2="195" stroke="#16a34a" stroke-width="2"/>
    <circle cx="95" cy="195" r="4" fill="#16a34a"/>
    <line x1="95" y1="195" x2="110" y2="210" stroke="#16a34a" stroke-width="2"/>
    <circle cx="110" cy="210" r="5" fill="#15803d"/>

    <text x="110" y="225" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">Efficient &amp; Fast</text>
    <text x="110" y="240" font-size="10" fill="#166534" text-anchor="middle">Steps automatically shrink near min</text>
  </g>

  <!-- Panel 3: Too Large Alpha -->
  <g transform="translate(450, 20)">
    <rect x="10" y="35" width="200" height="225" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
    <text x="110" y="58" font-size="13" font-weight="bold" fill="#be123c" text-anchor="middle">❌ α Too Large</text>
    <path d="M 25 80 Q 110 240 195 80" fill="none" stroke="#64748b" stroke-width="2"/>

    <!-- Overshooting / Diverging steps -->
    <circle cx="60" cy="140" r="4" fill="#e11d48"/>
    <line x1="60" y1="140" x2="175" y2="100" stroke="#e11d48" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="175" cy="100" r="4" fill="#e11d48"/>
    <line x1="175" y1="100" x2="25" y2="65" stroke="#e11d48" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="25" cy="65" r="4" fill="#e11d48"/>

    <text x="110" y="225" font-size="11" font-weight="bold" fill="#be123c" text-anchor="middle">Overshoots &amp; Diverges</text>
    <text x="110" y="240" font-size="10" fill="#9f1239" text-anchor="middle">Fails to reach minimum</text>
  </g>
</svg>