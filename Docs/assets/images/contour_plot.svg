<svg viewBox="0 0 680 340" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; border:1px solid #e0e0e0; border-radius:8px; padding:16px; font-family: Arial, sans-serif;">
  <!-- Title -->
  <text x="340" y="30" fill="#0070f3" font-size="20" font-weight="bold" text-anchor="middle">Contour Plot of Cost Function J(w,b)</text>

  <!-- Left: 3D Surface Concept Illustration -->
  <g transform="translate(20, 20)">
    <text x="140" y="30" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">3D Surface Plot ("Soup Bowl")</text>
    
    <!-- Outer bowl shell -->
    <path d="M 40 80 Q 140 260 240 80 Q 140 180 40 80 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" fill-opacity="0.5"/>
    <ellipse cx="140" cy="80" rx="100" ry="30" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4"/>
    
    <!-- Inner bowl slices -->
    <ellipse cx="140" cy="120" rx="75" ry="22" fill="none" stroke="#0369a1" stroke-width="1.5"/>
    <ellipse cx="140" cy="155" rx="50" ry="15" fill="none" stroke="#075985" stroke-width="1.5"/>
    
    <!-- Bottom Minimum Point -->
    <circle cx="140" cy="180" r="5" fill="#e11d48"/>
    <text x="140" y="210" font-size="12" font-weight="bold" fill="#e11d48" text-anchor="middle">Global Minimum</text>

    <text x="30" y="255" font-size="12" font-weight="bold" fill="#475569">Height = Cost J(w,b)</text>
  </g>

  <!-- Divider -->
  <line x1="320" y1="40" x2="320" y2="300" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4"/>

  <!-- Right: 2D Contour Plot -->
  <g transform="translate(340, 20)">
    <text x="160" y="30" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">2D Contour Plot (Topographical Map)</text>

    <!-- Axes -->
    <line x1="40" y1="260" x2="290" y2="260" stroke="#000" stroke-width="2.5"/>
    <line x1="40" y1="260" x2="40" y2="40" stroke="#000" stroke-width="2.5"/>

    <text x="165" y="295" font-size="13" font-weight="bold" text-anchor="middle">Parameter w (Weight)</text>
    <text x="20" y="150" font-size="13" font-weight="bold" transform="rotate(-90 20,150)" text-anchor="middle">Parameter b (Bias)</text>

    <!-- Concentric Ellipses (Contours) -->
    <!-- Outer Contour J = 4.0 -->
    <ellipse cx="170" cy="150" rx="100" ry="70" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <text x="275" y="155" font-size="11" fill="#64748b">J = 4.0</text>

    <!-- Middle Contour J = 2.0 -->
    <ellipse cx="170" cy="150" rx="70" ry="48" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="245" y="155" font-size="11" fill="#475569">J = 2.0</text>

    <!-- Inner Contour J = 0.5 -->
    <ellipse cx="170" cy="150" rx="40" ry="26" fill="none" stroke="#0284c7" stroke-width="2"/>
    <text x="215" y="155" font-size="11" fill="#0284c7">J = 0.5</text>

    <!-- Center Point: Global Minimum J = 0 -->
    <circle cx="170" cy="150" r="6" fill="#e11d48"/>
    <text x="170" y="138" font-size="11" font-weight="bold" fill="#e11d48" text-anchor="middle">Min (w*, b*)</text>

    <!-- Sample Point A on Contour J = 4.0 -->
    <circle cx="95" cy="100" r="5" fill="#f59e0b"/>
    <text x="80" y="90" font-size="11" font-weight="bold" fill="#d97706">Point A (High Cost)</text>
  </g>
</svg>